name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip
      - name: Build
        run: |
          F=$(find . -name settings.gradle -not -path './gradle-8.12/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle introuvable : les fichiers du mod ne sont pas dans le depot"; exit 1; fi
          cd "$(dirname "$F")"
          "$GITHUB_WORKSPACE/gradle-8.12/bin/gradle" build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChestESP-jar
          path: "**/build/libs/*.jar"
